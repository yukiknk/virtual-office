<!doctype html>
<html lang="ja">

<head>
	<!--
		オフィス画面。入室画面（index.html）から移動してくる。

		中身の組み立ては office/ 以下のモジュールが行い、担当が分かれている。
		  office/scene.js … メニューバー・キャンバス・モーダルのほぼ全部
		  office/voice.js … 音声と画面共有（#dock #banner #shares #share-big）
		id が付いている要素はそれらから参照されるため、id を変えると画面が動かなくなる。
	-->
	<meta charset="utf-8" />
	<!-- viewport-fit=cover は iPhone の画面下の帯（ホームバー）の分まで使い、余白は CSS の safe-area で取る -->
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

	<!-- タブに出る文字の既定値。config.jsの値に上書きされる -->
	<title data-config-title="バーチャルオフィス">バーチャルオフィス</title>

	<!-- 画面全体の書体を丸ゴシックに設定。preconnect を入れることで表示が早くなる -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet" />

	<!-- オフィス画面のスタイル。管理者ページ（admin.html）と共用している -->
	<link rel="stylesheet" href="style.css" />

	<!--
		表示文言の設定。
		  config.js       … 汎用の既定値を定義する（github公開用）
		  config.local.js … 組織名などを上書きする（github管理外）
	-->
	<script src="config.js"></script>
	<script src="config.local.js"></script>
</head>

<body>
	<!-- 画面全体の2カラム（左メニューバー＋右オフィス）。
	     id="admin" は管理者ページを先に作ったときの名残で、このページとは無関係。 -->
	<div id="admin">

		<!-- 左のメニューバー。中身が空の div は scene.js が後から埋める枠。 -->
		<aside id="rail">
			<!-- スマホでチャットを開いたときの閉じるボタン（mobile.js）。PC では出ない -->
			<button type="button" id="m-close" aria-label="メニューを閉じる">×</button>
			<!-- メニューを細い帯に畳む／元に戻す（panel.js の initRailToggle）。
			     畳んでもマイク・画面共有・離席は押せるように、アイコンだけを残す。 -->
			<button type="button" id="rail-toggle" title="メニューを畳む" aria-label="メニューを畳む">«</button>
			<h2 class="rail-h" data-config="orgName">デモオフィス</h2>
			<div id="roster"></div>   <!-- 在室者の一覧 -->

			<div class="rail-sub">チャット</div>
			<div id="chat-log"></div>   <!-- 古い順に並び、新着が下に足される。保存しないので退出で消える -->

			<!-- 文字数の上限はサーバー側（src/room.js）でも切っている。
			     ここを変えるだけでは効かないので、変更するときは両方を合わせること。 -->
			<form id="chat-form">
				<!-- 送る予定の画像（panel.js）。貼り付け・📎・ドロップで入り、× で外せる -->
				<div id="chat-preview" hidden><img alt="送る画像"><button type="button" id="chat-preview-remove" aria-label="画像を外す">×</button></div>
				<!-- placeholder は panel.js が書き換える。チャットは全員ではなく声が届く範囲の人にだけ
				     配られるので、いま誰に届くか（近くの人／会話エリアの名前）をここに出す。 -->
				<textarea id="chat-input" placeholder="近くの人へのメッセージ" maxlength="500" rows="1"
					title="Enter で送信 ／ Shift+Enter・Ctrl+Enter で改行"></textarea>
				<!-- 入力欄の右下に重ねて置く（位置は style.css）。文字ではなく記号なので aria-label で読みを与える -->
				<button type="submit" id="chat-send" aria-label="送信" title="送信（Enter）">➤</button>
				<!-- 画像を選んで貼る（スマホ向け。PC は Ctrl+V でも貼れる） -->
				<button type="button" id="chat-attach" aria-label="画像を貼る" title="画像を貼る（Ctrl+V でも貼れます）">📎</button>
				<input type="file" id="chat-file" accept="image/*" hidden>
			</form>
			<!-- チャットの画像を大きく出す（panel.js）。押すと閉じる -->
			<div id="chat-viewer" hidden><img alt="画像"></div>

			<!-- 状態を変えないボタン2つを横に並べる。よく使う「看板を作成」に手が届きやすいよう、チャットの下に置く。
			     離席・退出とは役割が違うので別の行にしてある
			     （退出の隣に置くと、押し間違えたときに接続が切れる）。 -->
			<!-- 畳んでいるあいだだけ出る。押すとメニューを開いてチャットの入力欄へ移る。
			     畳んでいる間に届いたメッセージの数を .badge に出す。 -->
			<button type="button" id="chat-open-btn" title="チャットを開く">
				<span class="bi">💬</span><span class="badge" hidden></span>
			</button>

			<!-- bl は開いているときに出す文字。畳んだときは、絵（bi）か短い文字（bs）に替わる。
			     2文字で収まるもの（看板・離席・退出）は文字のまま出し、収まらないものだけ絵にしている。 -->
			<div id="rail-tools">
				<button type="button" id="people-btn" title="勤務者一覧"><span class="bi">👥</span><span class="bl">勤務者一覧</span></button>
				<button type="button" id="comment-add-btn" title="看板を作成"><span class="bs">看板</span><span class="bl">看板を作成</span></button>
			</div>
			<div id="usage"></div>   <!-- 今月の転送量 -->
			<div id="actions">
				<button type="button" id="away-btn" class="actbtn" title="離席"><span class="bl">離席</span></button>
				<button type="button" id="leave-btn" class="actbtn danger" title="退出"><span class="bl">退出</span></button>
			</div>

			<!-- ここ2つだけ voice.js の担当。
			     ic（アイコン）と lb（ラベル）を分けてあるのは、状態に応じて
			     voice.js が両方を書き換えるため。 -->
			<div id="dock">
				<!-- 送っているマイク音量。ミュート中は voice.js が hidden にする。 -->
				<div class="level" id="mic-level" hidden><span></span></div>
				<div class="dock-row">
					<button type="button" id="mic-btn" class="toolbtn">
						<span class="ic">🔇</span>
						<span class="lb">ミュート中</span>
					</button>
					<button type="button" id="screen-btn" class="toolbtn">
						<span class="ic">🖥️</span>
						<span class="lb">画面共有</span>
					</button>
				</div>
				<!-- スピーカーの確認。voice.js が鳴らす。 -->
				<button type="button" id="audio-settings-btn" class="dock-mini">⚙ 音声の設定</button>
			</div>
		</aside>

		<!-- オフィス本体。#stage と #plan は管理者ページと同じ id を使っており、
		     style.css と、scene.js / admin/editor.js が同じ名前で取得している。 -->
		<section id="stage">
			<div id="banner"></div>   <!-- 音声・画面共有の状態表示（voice.js） -->
			<!-- スマホのときだけ出る。押すと小さなメニューが開き、チャット・勤務者一覧・音声の設定を
			     それぞれ単独で開ける（mobile.js）。チャットの未読数を ☰ とチャットの項目に出す -->
			<button type="button" id="m-menu" aria-label="メニュー" aria-expanded="false"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="badge" hidden></span></button>
			<div id="m-pop" hidden>
				<button type="button" data-act="chat"><span class="mi">💬</span>チャット<span class="badge" hidden></span></button>
				<button type="button" data-act="people"><span class="mi">👥</span>勤務者一覧</button>
				<button type="button" data-act="audio"><span class="mi">⚙</span>音声の設定</button>
			</div>

			<!-- width/height は飾り。scene.js が起動直後に画面サイズから計算し直す。
			     JS が走る前の一瞬だけ形が保たれるように書いてある。 -->
			<canvas id="plan" width="640" height="480"></canvas>

			<div id="shares"></div>   <!-- 共有画面の小窓（voice.js） -->
			<div id="share-big">
				<!-- 映像と、誰の画面かの表示（voice.js が書く）を重ねるための枠 -->
				<div class="share-big-box">
					<video autoplay playsinline muted></video>
					<span id="share-big-name" hidden></span>
					<!-- スマホのときだけ出る（mobile.js）。横向きの全画面、マイク、閉じる -->
					<div class="m-share-tools">
						<button type="button" id="m-share-close" class="m-share-btn" aria-label="閉じる">×</button>
						<button type="button" id="m-share-rotate" class="m-share-btn" aria-label="横向きにする">⟳</button>
						<button type="button" id="m-share-mic" class="m-round"><span class="ic">🔇</span><span class="lb">ミュート中</span></button>
					</div>
				</div>
			</div>

			<!-- 以下3つは hidden 属性で出し入れする。下のモーダル3つは .open クラス方式。
			     背景を暗くするフェードが要るものだけ .open にしてある。 -->
			<div id="call-alert" hidden></div>    <!-- 呼び出しを受けたときのバナー -->
			<!-- いまいる場所でできる操作（近くの人の呼び出し・家具のリンク）を、マップの下端に
			     1本の帯としてまとめて出す。別々に重ねて出すと、人が集まったときにマップを覆ってしまう。 -->
			<div id="prompts">
				<div id="call-prompt" hidden></div>   <!-- 近くの人を呼び出すボタン（panel.js が中身を作る） -->
				<div id="link-prompt" hidden>         <!-- 近くの家具に付いているリンク -->
					<span class="lp-text" id="link-label"></span>
					<button type="button" class="lp-open" id="link-open">開く</button>
				</div>
			</div>

			<!-- 勤務者一覧。表示は scene.js が .open クラスで切り替える。 -->
			<!-- 音声の設定。マイクとスピーカーの選び直しと確認（office/audio.js）。 -->
			<div id="audio-modal">
				<div class="cmodal-box">
					<div class="cmodal-head">音声の設定</div>

					<label class="cfield">
						<span class="clabel">マイク</span>
						<select id="au-mic" class="au-select"></select>
					</label>
					<div class="au-row">
						<button type="button" id="au-mic-test" class="au-btn">マイクをテスト</button>
						<div class="au-level" id="au-level" hidden><span></span></div>
					</div>
					<p id="au-mic-note" class="au-note"></p>

					<label class="cfield">
						<span class="clabel">スピーカー</span>
						<select id="au-spk" class="au-select"></select>
					</label>
					<div class="au-row">
						<button type="button" id="au-spk-test" class="au-btn">テスト音を鳴らす</button>
					</div>
					<p id="au-spk-note" class="au-note"></p>

					<div class="cmodal-foot">
						<button type="button" id="au-close">閉じる</button>
					</div>
				</div>
			</div>

			<div id="people-modal">
				<div class="cmodal-box">
					<div class="cmodal-head">勤務者一覧</div>
					<div id="people-list"></div>
					<div class="cmodal-foot">
						<button type="button" id="people-close">閉じる</button>
					</div>
				</div>
			</div>

			<!-- 離席中コメント。上限100文字はサーバー側とも合わせている。 -->
			<div id="away-modal">
				<div class="cmodal-box">
					<div class="cmodal-head">💬 離席中のコメント</div>
					<!-- 上限の 100 文字はサーバー側（src/room.js の onAway / onHello）でも切っている。
					     変えるときは、maxlength・下の案内文・サーバーの3か所を合わせること。 -->
					<textarea id="away-text" rows="3" placeholder="周りの人に状況を伝えましょう" maxlength="100"></textarea>
					<!-- 上限と残りの文字数。数字は panel.js が入力のたびに書き換える -->
					<div class="cmodal-note"><span>100文字まで入力できます</span><span id="away-count">0 / 100</span></div>
					<div class="cmodal-foot">
						<button type="button" id="away-save" class="primary">更新</button>
					</div>
				</div>
			</div>
		</section>
	</div>

	<!-- スマホのときだけ出る下の帯（mobile.js）。左にマイク、真ん中にジョイスティック、右に退出 -->
	<div id="m-bar">
		<button type="button" id="m-mic" class="m-round"><span class="ic">🔇</span><span class="lb">ミュート中</span></button>
		<div id="joy" aria-label="移動"><div id="joy-knob"></div></div>
		<button type="button" id="m-leave" class="m-round danger"><span class="ic">🚪</span><span class="lb">退出</span></button>
	</div>

	<!-- 看板の作成・編集。画面全体を覆うので #admin の外に置いている。

	     各入力を <label> で包んでいるので、ラベルをクリックすると入力欄に
	     フォーカスが移る（for 属性が要らない書き方）。
	     期限日時の select は中身が空で、選択肢は scene.js が作る。 -->
	<div id="comment-modal">
		<div class="cmodal-box">
			<div class="cmodal-head" id="c-title">看板の作成</div>

			<div class="cfield">
				<span class="clabel">テキスト</span>
				<!-- 部分ごとに装飾できる編集欄。中身（ボタンと入力欄）は richtext.js が作る -->
				<div id="c-editor"></div>
			</div>

			<label class="cfield cfield-bg">
				<span class="clabel">看板の背景色</span>
				<input type="color" id="c-bg" value="#ffffff" />
			</label>

			<div class="cfield">
				<span class="clabel">期限日時（必須）</span>
				<div class="cdt">
					<select id="c-year"></select><span>年</span>
					<select id="c-month"></select><span>月</span>
					<select id="c-day"></select><span>日</span>
				</div>
				<div class="cdt">
					<select id="c-hour"></select><span>時</span>
					<select id="c-min"></select><span>分</span>
				</div>
			</div>

			<p id="c-err" class="cmodal-err"></p>

			<div class="cmodal-foot">
				<button type="button" id="c-cancel">キャンセル</button>
				<button type="button" id="c-save" class="primary">作成</button>
			</div>
		</div>
	</div>

	<!-- type="module" は自動で defer 扱いになるので、DOM の構築を待ってから走る -->
	<script type="module" src="office/main.js"></script>
</body>

</html>
