<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>バーチャルオフィス 管理者ページ</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div id="admin">
		<!-- メニューバー -->
		<aside id="rail">
			<h2>管理モード</h2>
			<div id="mode-status" class="status idle">編集する対象をタブから選んでください</div>

			<div class="group">
				<div class="group-label">編集対象</div>
				<div id="tabs"></div>
				<div id="current">
					<span class="clbl">選択中</span>
					<canvas id="current-preview" width="36" height="36"></canvas>
				</div>
			</div>

			<div class="group">
				<div class="group-label">消しゴム</div>
				<button type="button" id="erase-tool" class="danger">消去</button>
			</div>

			<div class="group">
				<div class="group-label">表示・保存</div>
				<button type="button" id="showall-tool">全体を表示</button>
				<button type="button" id="savemode-tool">保存モード：手動</button>
				<button type="button" id="save-tool">保存</button>
				<div id="save-state" class="savestate">保存済み</div>
				<button type="button" id="reflect-tool">利用者に反映</button>
			</div>

			<div class="group">
				<div class="group-label">Slack 通知</div>
				<input type="text" id="webhook-url" autocomplete="off" spellcheck="false"
					placeholder="https://hooks.slack.com/services/..." />
				<div class="webhook-actions">
					<button type="button" id="webhook-save">保存</button>
					<button type="button" id="webhook-clear" class="danger">削除</button>
				</div>
				<div id="webhook-state" class="savestate">確認中…</div>
			</div>
		</aside>

		<!-- キャンバス -->
		<section id="stage">
			<canvas id="plan" width="640" height="480"></canvas>
			<script type="module" src="admin/main.js"></script>
		</section>
	</div>

	<!-- タイル選択モーダル -->
	<div id="modal">
		<div class="modal-box">
			<div class="modal-head">
				<span id="modal-title"></span>
				<button type="button" id="modal-close">×</button>
			</div>
			<div class="modal-body">
				<div id="furni-sheets"></div>
				<canvas id="modal-canvas"></canvas>
			</div>
		</div>
	</div>

	<!-- コメント（看板）設定モーダル -->
	<div id="comment-modal">
		<div class="cmodal-box">
			<div class="cmodal-head">看板の設定</div>

			<div class="cfield">
				<span class="clabel">テキスト</span>
				<!-- 部分ごとに装飾できる編集欄。中身（ボタンと入力欄）は richtext.js が作る -->
				<div id="c-editor"></div>
			</div>

			<label class="cfield cfield-bg">
				<span class="clabel">看板の背景色</span>
				<input type="color" id="c-bg" value="#ffffff" />
			</label>

			<div class="cmodal-foot">
				<button type="button" id="c-cancel">キャンセル</button>
				<button type="button" id="c-save" class="primary">保存</button>
			</div>
		</div>
	</div>

	<!-- 家具のリンク設定モーダル -->
	<div id="furni-modal">
		<div class="cmodal-box">
			<div class="cmodal-head">家具のリンク設定</div>

			<label class="cfield">
				<span class="clabel">名前（ラベル）</span>
				<input type="text" id="fu-label" placeholder="例：日報フォーム" />
			</label>
			<label class="cfield">
				<span class="clabel">URL</span>
				<input type="text" id="fu-url" placeholder="https://..." />
			</label>

			<div class="cmodal-foot">
				<button type="button" id="fu-clear" class="danger">リンクを削除</button>
				<button type="button" id="fu-cancel">キャンセル</button>
				<button type="button" id="fu-save" class="primary">保存</button>
			</div>
		</div>
	</div>
</body>

</html>
